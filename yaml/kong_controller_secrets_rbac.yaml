apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kong-controller-read-secrets
  namespace: default
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kong-controller-read-secrets
  namespace: default
subjects:
- kind: ServiceAccount
  name: kong-controller
  namespace: kong
roleRef:
  kind: Role
  name: kong-controller-read-secrets
  apiGroup: rbac.authorization.k8s.io
